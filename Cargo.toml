[package]
name = "oxideav-source"
version = "0.1.6"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/OxideAV/oxideav-source"
authors = ["Mark Karpeles"]
description = "Generic source registry: opens URIs (file://, plus http:// via oxideav-http) into Read+Seek; prefetch buffer wrapper"

readme = "README.md"
homepage = "https://github.com/OxideAV/oxideav-source"
keywords = ["multimedia", "io", "source", "streaming", "pure-rust"]
categories = ["multimedia"]

[dependencies]
oxideav-core = "0.1"

[dev-dependencies]
criterion = "0.5"

# Round 399 benches. Self-contained — every payload is synthesised
# in-bench (ramp bytes / generated percent- and base64-encodings), so
# no fixtures and no filesystem beyond a tempfile for the file-backed
# rows.
[[bench]]
name = "read_paths"
harness = false
