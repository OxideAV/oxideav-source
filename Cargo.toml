[package]
name = "oxideav-source"
version = "0.1.3"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/OxideAV/oxideav-source"
authors = ["Mark Karpeles"]
description = "Generic source registry: opens URIs (file://, plus http:// via oxideav-http) into Read+Seek; prefetch buffer wrapper"

readme = "README.md"
homepage = "https://github.com/OxideAV/oxideav-source"
keywords = ["multimedia", "io", "source", "streaming", "pure-rust"]
categories = ["multimedia"]

[dependencies]
oxideav-core = "0.1"
# Distributed-slice auto-registration into `oxideav_core::REGISTRARS`
# via the `oxideav_core::register!` macro. Tiny crate, no transitive
# deps; works on every target including wasm.
linkme = "0.3"
